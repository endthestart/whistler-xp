<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- Whistler XP: openly licensed stand-ins for XP-era font names.
     <accept> keeps the real family first when it is installed (for example
     by the optional originals importer). -->
<fontconfig>
  <alias binding="same"><family>Trebuchet MS</family><accept><family>Fira Sans</family></accept></alias>
  <alias binding="same"><family>Franklin Gothic Medium</family><accept><family>Fira Sans</family></accept></alias>
  <alias binding="same"><family>MS Shell Dlg</family><accept><family>Tahoma</family></accept></alias>
  <alias binding="same"><family>MS Shell Dlg 2</family><accept><family>Tahoma</family></accept></alias>
  <alias binding="same"><family>MS Sans Serif</family><accept><family>Tahoma</family></accept></alias>
  <alias binding="same"><family>Segoe UI</family><accept><family>Tahoma</family></accept></alias>
  <alias binding="same"><family>Verdana</family><accept><family>DejaVu Sans</family></accept></alias>
  <alias binding="same"><family>Arial</family><accept><family>Liberation Sans</family></accept></alias>
  <alias binding="same"><family>Times New Roman</family><accept><family>Liberation Serif</family></accept></alias>
  <alias binding="same"><family>Courier New</family><accept><family>Liberation Mono</family></accept></alias>
  <alias binding="same"><family>Lucida Console</family><accept><family>DejaVu Sans Mono</family></accept></alias>
  <alias>
    <family>sans-serif</family>
    <prefer><family>Tahoma</family><family>DejaVu Sans</family></prefer>
  </alias>
  <alias>
    <family>serif</family>
    <prefer><family>Liberation Serif</family><family>DejaVu Serif</family></prefer>
  </alias>
  <alias>
    <family>monospace</family>
    <prefer><family>DejaVu Sans Mono</family><family>Liberation Mono</family></prefer>
  </alias>
</fontconfig>
