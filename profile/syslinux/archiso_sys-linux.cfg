LABEL whistler
TEXT HELP
Start Whistler XP from this disc. Nothing on your computer is changed.
ENDTEXT
MENU LABEL Start Whistler XP
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux-cachyos
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux-cachyos.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% cow_spacesize=60% quiet splash loglevel=3 rd.udev.log_level=3 systemd.show_status=false vt.global_cursor_default=0

LABEL whistlersafe
TEXT HELP
Start with basic video (use this if the screen stays black).
ENDTEXT
MENU LABEL Start Whistler XP (Safe Mode - basic video)
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux-cachyos
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux-cachyos.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% cow_spacesize=60% nomodeset
