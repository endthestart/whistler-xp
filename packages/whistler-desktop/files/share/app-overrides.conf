# Whistler renames and regroups stock applications the way Windows XP did.
# Each section is a desktop file id from /usr/share/applications; keys are
# set on the copy written to /usr/share/whistler/xdg-data/applications.
# X-Whistler-Folder: start menu folder ("" = top level, "-" = hidden).

[firefox.desktop]
Name=Mozilla Firefox
X-Whistler-Folder=

